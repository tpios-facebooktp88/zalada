workflows:
  dylib-build:
    name: LazadaFarm - Build Dylib
    max_build_duration: 60
    environment:
      xcode: 16.4
    scripts:
      - name: Build dylib
        script: |
          set -e
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build

          # Compile CHMTouchBackend.m thành object
          xcrun clang \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDKROOT" \
            -fobjc-arc \
            -Wno-deprecated-declarations \
            -c CHMTouchBackend.m \
            -o build/CHMTouchBackend.o

          # Build dylib gồm Tweak.mm + CHMTouchBackend.o
          xcrun clang \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDKROOT" \
            -fobjc-arc \
            -dynamiclib \
            -Wno-deprecated-declarations \
            -Xlinker -undefined \
            -Xlinker dynamic_lookup \
            -framework Foundation \
            -framework WebKit \
            -framework UIKit \
            -lobjc \
            -install_name @rpath/lazada.dylib \
            -o build/lazada.dylib \
            Tweak.mm \
            build/CHMTouchBackend.o

      - name: Package
        script: |
          mkdir -p output
          cp build/lazada.dylib output/lazada_$BUILD_NUMBER.dylib

    artifacts:
      - output/lazada_*.dylib