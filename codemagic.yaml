workflows:
  dylib-build:
    name: Build Dylib
    max_build_duration: 60
    environment:
      xcode: 16.4
    scripts:
      - name: Build dylib
        script: |
          set -e
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build
          xcrun clang \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDKROOT" \
            -fobjc-arc \
            -dynamiclib \
            -Xlinker -undefined \
            -Xlinker dynamic_lookup \
            -framework Foundation \
            -framework WebKit \
            -framework UIKit \
            -o build/lazada.dylib \
            Tweak.mm

      - name: Package
        script: |
          mkdir -p output
          cp build/lazada.dylib output/lazada_$BUILD_NUMBER.dylib

    artifacts:
      - output/lazada_*.dylib