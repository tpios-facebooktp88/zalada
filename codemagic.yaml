      - name: Build dylib
        script: |
          set -e
          xcrun -sdk iphoneos clang++ \
            -arch arm64 \
            -mios-version-min=16.0 \
            -dynamiclib \
            -fobjc-arc \
            -ObjC \
            -all_load \
            -framework Foundation \
            -framework WebKit \
            -framework UIKit \
            -framework CoreGraphics \
            -lobjc \
            -install_name @rpath/lazada.dylib \
            -o lazada.dylib \
            LazadaFarm/Tweak.mm