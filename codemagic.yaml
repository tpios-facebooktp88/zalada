workflows:
  dylib-build:
    name: LazadaFarm - Build Dylib
    max_build_duration: 60
    environment:
      xcode: 16.4
    scripts:
      - name: Build dylib
        script: |
          set -e
          xcrun -sdk iphoneos clang++ \
            -arch arm64 \
            -mios-version-min=16.0 \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            -framework WebKit \
            -framework UIKit \
            -lobjc \
            -install_name @rpath/lazada.dylib \
            -o lazada.dylib \
            LazadaFarm/Tweak.mm

    artifacts:
      - lazada.dylib